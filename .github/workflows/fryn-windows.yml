name: Build Fryn Windows

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      OPENCODE_CHANNEL: prod
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Fryn backend
        shell: pwsh
        env:
          FRYN_BACKEND_URL: ${{ vars.FRYN_BACKEND_URL }}
          FRYN_MICROSOFT_CLIENT_ID: ${{ vars.FRYN_MICROSOFT_CLIENT_ID }}
          FRYN_MICROSOFT_TENANT: ${{ vars.FRYN_MICROSOFT_TENANT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FRYN_BACKEND_URL)) {
            throw "Crie a variavel de repositorio FRYN_BACKEND_URL com a URL HTTPS do seu backend Fryn antes de gerar o instalador."
          }
          $clientId = if ([string]::IsNullOrWhiteSpace($env:FRYN_MICROSOFT_CLIENT_ID)) { "7889876a-1fa9-4165-9d73-bb1d234dde2d" } else { $env:FRYN_MICROSOFT_CLIENT_ID.Trim() }
          $tenant = if ([string]::IsNullOrWhiteSpace($env:FRYN_MICROSOFT_TENANT)) { "common" } else { $env:FRYN_MICROSOFT_TENANT.Trim() }
          $config = @{
            backendUrl = $env:FRYN_BACKEND_URL.TrimEnd('/')
            microsoft = @{
              clientId = $clientId
              tenant = $tenant
            }
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "packages/desktop/fryn-backend.json" -Value $config -Encoding utf8
          Write-Host "Backend Fryn e Microsoft Client ID configurados para o build."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Azure login for signing
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package Windows installer
        working-directory: packages/desktop
        run: bun run package:win

      - name: Verify Fryn installer signature
        if: env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME != '' && env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE != '' && env.AZURE_TRUSTED_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          $file = "${{ github.workspace }}\packages\desktop\dist\Fryn-Setup.exe"
          $sig = Get-AuthenticodeSignature $file
          if ($sig.Status -ne "Valid") {
            throw "Invalid signature for ${file}: $($sig.Status)"
          }
          Write-Host "Fryn installer signature is valid: $($sig.SignerCertificate.Subject)"

      - name: Upload Fryn installer
        uses: actions/upload-artifact@v4
        with:
          name: Fryn-Windows
          path: packages/desktop/dist/Fryn-Setup.exe
