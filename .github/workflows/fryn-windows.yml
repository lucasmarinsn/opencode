name: Build Fryn Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Fryn backend
        shell: pwsh
        env:
          FRYN_BACKEND_URL: ${{ vars.FRYN_BACKEND_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:FRYN_BACKEND_URL)) {
            throw "Crie a variavel de repositorio FRYN_BACKEND_URL com a URL HTTPS do seu backend Fryn antes de gerar o instalador."
          }
          $config = @{ backendUrl = $env:FRYN_BACKEND_URL.TrimEnd('/') } | ConvertTo-Json
          Set-Content -Path "packages/desktop/fryn-backend.json" -Value $config -Encoding utf8
          Write-Host "Backend Fryn configurado para o build."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build desktop
        working-directory: packages/desktop
        run: bun run build

      - name: Package Windows installer
        working-directory: packages/desktop
        run: bun run package:win

      - name: Upload Fryn installer
        uses: actions/upload-artifact@v4
        with:
          name: Fryn-Windows
          path: packages/desktop/dist/Fryn-Setup.exe
